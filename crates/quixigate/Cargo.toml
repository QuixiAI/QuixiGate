[package]
name = "quixigate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust single-binary AI gateway for local models, coding subscriptions, and OpenRouter cloud burst"

[[bin]]
name = "quixigate"
path = "src/main.rs"

[features]
default = ["ui", "subscription-oauth"]
ui = ["quixigate-proxy/ui"]
subscription-oauth = [
    "quixigate-auth/subscription-oauth",
    "quixigate-providers/subscription-oauth",
    "quixigate-router/subscription-oauth",
    "quixigate-proxy/subscription-oauth",
]
demo = [
    "dep:bytes",
    "dep:futures",
    "dep:opentelemetry-proto",
    "dep:parking_lot",
    "dep:prost",
]

[dependencies]
quixigate-core.workspace = true
quixigate-vault.workspace = true
quixigate-db.workspace = true
quixigate-auth.workspace = true
quixigate-providers.workspace = true
quixigate-router.workspace = true
quixigate-telemetry.workspace = true
quixigate-proxy = { workspace = true, default-features = false }
anyhow.workspace = true
axum.workspace = true
bytes = { workspace = true, optional = true }
chrono.workspace = true
clap.workspace = true
directories.workspace = true
futures = { workspace = true, optional = true }
inquire.workspace = true
open.workspace = true
opentelemetry-proto = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
