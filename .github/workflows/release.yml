name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build Embedded UI
        working-directory: ui
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p quixigate
      - name: Package Tarball & Checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/quixigate" dist/quixigate
          cp LICENSE README.md dist/
          tar -C dist -czf "quixigate-${{ matrix.target }}.tar.gz" quixigate LICENSE README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "quixigate-${{ matrix.target }}.tar.gz" > "quixigate-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "quixigate-${{ matrix.target }}.tar.gz" > "quixigate-${{ matrix.target }}.tar.gz.sha256"
          fi
      - name: Package Zip & Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/quixigate.exe" dist/quixigate.exe
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/quixigate.exe, dist/LICENSE, dist/README.md -DestinationPath "quixigate-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "quixigate-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  quixigate-${{ matrix.target }}.zip" | Out-File -Encoding ascii "quixigate-${{ matrix.target }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            quixigate-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            quixigate-*.tar.gz
            quixigate-*.tar.gz.sha256
            quixigate-*.zip
            quixigate-*.zip.sha256
          generate_release_notes: true
